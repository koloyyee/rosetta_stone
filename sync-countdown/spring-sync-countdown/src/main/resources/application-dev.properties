spring.application.name=sync-countdown
spring.datasource.url=jdbc:h2:mem:sync-countdown;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-dev.sql
jwt.public-key=classpath:certs/public.pem
jwt.private-key=classpath:certs/private.pem
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
